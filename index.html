<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Rutina">
<title>Mi Rutina</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0f1115;--surface:#181b22;--line:#2c313c;--text:#eef0f4;--muted:#9aa3b2;--accent:#ff8a3d;--accent-ink:#1a0d03;--danger:#ff6b6b;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{accent-color:var(--accent)}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--text);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  display:grid;place-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
::selection{background:rgba(255,138,61,.35)}
.gate{width:100%;max-width:380px}
.gate[hidden]{display:none}
.logo{width:64px;height:64px;display:block;margin:0 0 20px;border-radius:16px}
h1{margin:0;font-size:26px}
p{margin:6px 0 24px;color:var(--muted)}
label.pw{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
input[type=password]{width:100%;height:56px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);
  color:var(--text);font:inherit;font-size:18px;padding:0 14px;caret-color:var(--accent)}
input[type=password]:focus{outline:none;border-color:var(--accent)}
.rem{display:flex;align-items:center;gap:10px;min-height:48px;color:var(--muted);font-size:15px;cursor:pointer}
.rem input{width:20px;height:20px;margin:0}
button{width:100%;height:56px;margin-top:8px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);
  font:inherit;font-size:17px;font-weight:700;cursor:pointer;transition:transform .12s cubic-bezier(.2,.8,.2,1)}
button:active{transform:scale(.98)}
button:disabled{opacity:.7;cursor:progress}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.err{min-height:24px;margin:14px 0 0;color:var(--danger);font-size:15px}
@media (prefers-reduced-motion:reduce){button:active{transform:none}}
</style>
</head>
<body>
<main class="gate" id="gate" hidden>
  <img class="logo" src="icon.svg" alt="">
  <h1>Mi Rutina</h1>
  <p>Ingresá tu contraseña. En este dispositivo se pide una sola vez.</p>
  <form id="form" autocomplete="on">
    <input type="text" name="username" value="mi-rutina" autocomplete="username" hidden>
    <label class="pw" for="pw">Contraseña</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <label class="rem"><input type="checkbox" id="rem" checked> Recordar en este dispositivo</label>
    <button id="btn" type="submit">Entrar</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</main>

const KEY = 'miRutina.key';
const $ = id => document.getElementById(id);
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = u => { let s = ''; u.forEach(b => s += String.fromCharCode(b)); return btoa(s); };

async function decryptWith(raw){
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(P.iv)}, key, b64d(P.ct));
  return new TextDecoder().decode(pt);
}
async function derive(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:b64d(P.salt), iterations:P.iter}, base, 256));
}
async function show(html){
  // Si el documento todavía se está leyendo, document.open() se ignora y la app se agregaría debajo.
  if (document.readyState === 'loading') await new Promise(r => document.addEventListener('DOMContentLoaded', r, {once:true}));
  document.open(); document.write(html); document.close();
}
function showGate(msg){
  $('gate').hidden = false;
  if (msg) $('err').textContent = msg;
  $('pw').focus();
}

(async () => {
  if (!P){ showGate('Esta página todavía no fue cifrada.'); return; }
  if (!window.crypto || !crypto.subtle){ showGate('Abrí la app desde su dirección https para poder descifrarla.'); return; }
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  if (saved){
    try { await show(await decryptWith(b64d(saved))); return; }
    catch(e){ try { localStorage.removeItem(KEY); } catch(_){} }
  }
  showGate();
})();

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('btn');
  btn.disabled = true; btn.textContent = 'Abriendo…'; $('err').textContent = '';
  try {
    const raw = await derive($('pw').value);
    const html = await decryptWith(raw);
    if ($('rem').checked){ try { localStorage.setItem(KEY, b64e(raw)); } catch(_){} }
    await show(html);
  } catch(err){
    btn.disabled = false; btn.textContent = 'Entrar';
    $('err').textContent = 'Contraseña incorrecta.';
    $('pw').select();
  }
});
})();
</script>
